# Databricks App runtime config. Spec: specs/06-app.md
# PGHOST / PGUSER / PGDATABASE are injected by the `postgres` app resource; the endpoint path (used
# to mint OAuth DB tokens) is not, so it is set here.
command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: LAKEBASE_ENDPOINT
    value: projects/ampera-demo/branches/production/endpoints/primary
