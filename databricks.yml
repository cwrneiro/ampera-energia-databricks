bundle:
  name: ampera

include:
  - resources/*.yml
  - targets/*.yml        # per-environment overlays: target, host and the environment-specific variables (SETUP.md)

sync:
  include:
    - app/frontend/dist/**   # gitignored build output the app serves (spec 06)

variables:
  catalog:
    description: UC catalog for the medallion (schemas ampera_bronze / ampera_silver / ampera_gold / ampera_gold_lb)
  lakebase_project:
    description: Lakebase project the app reads (branch production, database databricks_postgres)
    default: ampera-demo
  # Lakebase synced-table pipelines (SNAPSHOT). Created by `databricks postgres create-synced-table`
  # (DAB support for synced tables isn't available yet), so referenced by id. Spec: specs/05
  sync_pipeline_generation_daily:
  sync_pipeline_plant_location:
  sync_pipeline_reconciliation_monthly:
  sync_pipeline_reconciliation_ai_review:
  sync_pipeline_curtailment_daily:
  warehouse_id:
    description: SQL warehouse the Genie space queries (spec 07)
