# Ampera app (FastAPI + React) reading Lakebase ampera_gold_lb + a Genie chat on behalf of the user.
# Spec: specs/06-app.md, specs/14-app-intelligence.md
# Build the frontend first: (cd app/frontend && npm ci && npm run build)
resources:
  apps:
    ampera_app:
      name: ampera-app
      description: Geração reconciliada ONS + ANEEL SIGA, curtailment e chat com Genie
      source_code_path: ../app
      user_api_scopes: [dashboards.genie]   # Genie runs as the signed-in user (UC grants apply)
      permissions:                          # clients use the same app, scoped to their plants (spec 17)
        - group_name: ampera_clients
          level: CAN_USE
      resources:
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: genie
          genie_space:
            name: Ampera · Geração Elétrica
            space_id: ${resources.genie_spaces.ampera_genie.id}
            permission: CAN_RUN
